<!-- 📌 [최종 완성] 모든 내용(입력+단추+결과)이 우측 바 내부로 들어간 AI 내비게이션 바 -->

<aside class="ai-sidebar">

    <!-- 상단 -->
    <div class="ai-sidebar-header">

        <div class="ai-live-wrap">
            <!--<span class="ai-live-dot"></span>-->

            <span class="ai-title">
                Navigation Bar
            </span>
        </div>

    </div>

    <!-- 스크롤 영역 -->
    <div class="ai-sidebar-body custom-scrollbar">

        <!-- 입력 -->
        <div class="ai-section">

            <label class="ai-label">
                🌿 스마트팜 분석 문장 입력
            </label>

            <textarea
                id="ai-input-text"
                rows="3"
                class="ai-textarea"
                placeholder="분석할 내용을 입력하세요..."
            ></textarea>

        </div>

        <!-- 파이프라인 -->
        <div class="ai-section">

            <label class="ai-label">
                ⚙️ 파이프라인 스레드
            </label>

            <div class="ai-pipeline-list">

                <div id="step-text-gen"
                     onclick="triggerSinglePipeline('text-gen')"
                     class="ai-pipeline-card">

                    <span>📝 텍스트 생성</span>
                    <span class="status-icon">대기</span>

                </div>

                <div id="step-translation"
                     onclick="triggerSinglePipeline('translation')"
                     class="ai-pipeline-card">

                    <span>🌐 번역</span>
                    <span class="status-icon">대기</span>

                </div>

                <div id="step-sentiment"
                     onclick="triggerSinglePipeline('sentiment')"
                     class="ai-pipeline-card">

                    <span>❤️ 감성 분석</span>
                    <span class="status-icon">대기</span>

                </div>

                <div id="step-ner"
                     onclick="triggerSinglePipeline('ner')"
                     class="ai-pipeline-card">

                    <span>🔍 개체명 분석</span>
                    <span class="status-icon">대기</span>

                </div>

                <div id="step-qna"
                     onclick="triggerSinglePipeline('qna')"
                     class="ai-pipeline-card">

                    <span>❓ QnA</span>
                    <span class="status-icon">대기</span>

                </div>

            </div>

        </div>

        <!-- 결과 -->
        <div class="ai-section">

            <label class="ai-label">
                📊 SLM 실시간 결과
            </label>

            <div class="ai-result-card">
                <div class="ai-result-title">📝 Text Generation</div>
                <div id="res-text-gen">진단 전</div>
            </div>

            <div class="ai-result-card">
                <div class="ai-result-title">🌐 Translation</div>
                <div id="res-translation">진단 전</div>
            </div>

            <div class="ai-result-card">
                <div class="ai-result-title">❤️ Sentiment</div>
                <div id="res-sentiment">진단 전</div>
            </div>

            <div class="ai-result-card">
                <div class="ai-result-title">🔍 NER</div>
                <div id="res-ner">진단 전</div>
            </div>

            <div class="ai-result-card">
                <div class="ai-result-title">❓ QnA</div>
                <div id="res-qna">진단 전</div>
            </div>

        </div>

    </div>

    <!-- 하단 -->
    <div class="ai-sidebar-footer">

        <button
            onclick="startAllPipelines()"
            class="ai-run-btn">

            🚀 통합 AI 진단 시작

        </button>

    </div>

</aside>
<style>

.ai-sidebar{
    position:fixed;
    top:64px;
    right:0;
    width:320px;
    height:calc(100vh - 64px);

    background:#ffffff;
    border-left:1px solid #e5e7eb;

    z-index:9999;

    overflow:hidden;

    box-shadow:
    0 10px 25px rgba(0,0,0,0.08);
}

/* 상단 */
.ai-sidebar-header{
    height:60px;

    border-bottom:1px solid #f1f5f9;

    display:flex;
    align-items:center;

    padding:0 16px;

    background:#fff;
}

.ai-live-wrap{
    display:flex;
    align-items:center;
    gap:10px;
}

.ai-live-dot{
    width:10px;
    height:10px;

    border-radius:999px;

    background:#10b981;

    animation:pulse 1.5s infinite;
}

.ai-title{
    font-size:12px;
    font-weight:700;

    letter-spacing:2px;

    color:#047857;

    text-transform:uppercase;
}

/* 스크롤 핵심 */
.ai-sidebar-body{
    position:absolute;

    top:60px;
    bottom:72px;

    left:0;
    right:0;

    overflow-y:auto;

    padding:16px;
}

/* 하단 */
.ai-sidebar-footer{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:72px;

    border-top:1px solid #f1f5f9;

    background:#fff;

    display:flex;
    align-items:center;

    padding:16px;
}

/* 섹션 */
.ai-section{
    margin-bottom:24px;
}

.ai-label{
    display:block;

    font-size:11px;
    font-weight:700;

    color:#94a3b8;

    margin-bottom:10px;

    letter-spacing:1px;
}

/* 입력창 */
.ai-textarea{
    width:100%;

    border:1px solid #d1d5db;

    border-radius:14px;

    padding:12px;

    resize:none;

    font-size:12px;

    outline:none;

    background:#f8fafc;
}

.ai-textarea:focus{
    border-color:#10b981;

    box-shadow:
    0 0 0 3px rgba(16,185,129,0.15);
}

/* 파이프라인 */
.ai-pipeline-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.ai-pipeline-card{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:14px;

    border-radius:14px;

    border:1px solid #e5e7eb;

    background:#f9fafb;

    cursor:pointer;

    transition:0.2s;
}

.ai-pipeline-card:hover{
    border-color:#10b981;
    background:#ffffff;
}

/* 결과 */
.ai-result-card{
    background:#f9fafb;

    border:1px solid #e5e7eb;

    border-radius:14px;

    padding:14px;

    margin-bottom:14px;

    font-size:12px;
}

.ai-result-title{
    font-weight:700;

    color:#64748b;

    margin-bottom:10px;
}

/* 버튼 */
.ai-run-btn{
    width:100%;

    height:42px;

    border:none;

    border-radius:14px;

    background:#10b981;

    color:white;

    font-size:12px;
    font-weight:700;

    cursor:pointer;

    transition:0.2s;
}

.ai-run-btn:hover{
    background:#059669;
}

/* 스크롤 */
.custom-scrollbar::-webkit-scrollbar{
    width:6px;
}

.custom-scrollbar::-webkit-scrollbar-thumb{
    background:#cbd5e1;
    border-radius:999px;
}

.custom-scrollbar::-webkit-scrollbar-track{
    background:transparent;
}

/* 애니메이션 */
@keyframes pulse{
    0%{
        transform:scale(1);
        opacity:1;
    }

    50%{
        transform:scale(1.4);
        opacity:0.5;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}

</style>

<script>
function toggleDrawer(isOpen) {
    const drawer = document.getElementById('ai-result-drawer');
    if (isOpen) {
        drawer.classList.remove('translate-x-full'); // 화면 좌측으로 밀고 나오기
    } else {
        drawer.classList.add('translate-x-full');    // 오른쪽 벽 뒤로 숨기기
    }
}

const pipelineSteps = {
    'text-gen': { id: 'step-text-gen', endpoint: '/api/ai/text-gen', resId: 'res-text-gen' },
    'translation': { id: 'step-translation', endpoint: '/api/ai/translation', resId: 'res-translation' },
    'sentiment': { id: 'step-sentiment', endpoint: '/api/ai/sentiment', resId: 'res-sentiment' },
    'ner': { id: 'step-ner', endpoint: '/api/ai/ner', resId: 'res-ner' },
    'qna': { id: 'step-qna', endpoint: '/api/ai/qna', resId: 'res-qna' }
};

async function triggerSinglePipeline(key) {
    const inputElement = document.getElementById('ai-input-text');
    const inputText = inputElement.value.trim() || "스마트팜 파프리카 자동 재배 시스템";
    if (!inputElement.value.trim()) inputElement.value = inputText;
    await runPipelineBackend(key, inputText);
}

async function startAllPipelines() {
    const inputElement = document.getElementById('ai-input-text');
    const inputText = inputElement.value.trim() || "스마트팜 파프리카 자동 재배 시스템";
    if (!inputElement.value.trim()) inputElement.value = inputText;

    for (let key in pipelineSteps) {
        updateUIState(key, 'ready');
    }
    for (let key in pipelineSteps) {
        const success = await runPipelineBackend(key, inputText);
        if (!success) break;
    }
}

async function runPipelineBackend(key, text) {
    const config = pipelineSteps[key];
    updateUIState(key, 'loading');

    try {
        const response = await fetch(config.endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text, context: text })
        });

        if (!response.ok) throw new Error('네트워크 응답 실패');
        const data = await response.json();

        updateUIState(key, 'success');
        renderResult(key, data); // 바로 우측 바 내부 매핑 창에 바인딩 처리
        return true;
    } catch (error) {
        console.error(error);
        updateUIState(key, 'error');
        return false;
    }
}

function updateUIState(key, state) {
    const cfg = pipelineSteps[key];
    const card = document.getElementById(cfg.id);
    if (!card) return;
    const badge = card.querySelector('.status-icon');

    if (state === 'ready') {
        card.className = "flex items-center justify-between p-3 bg-gray-50 border border-gray-100 rounded-xl cursor-pointer hover:border-emerald-500 hover:bg-white transition-all duration-200 shadow-sm";
        badge.className = "status-icon bg-gray-200 text-gray-600 px-2 py-0.5 rounded-full font-medium text-[10px]";
        badge.innerHTML = "대기중";
    } else if (state === 'loading') {
        card.className = "flex items-center justify-between p-3 bg-amber-50/70 border border-amber-400 rounded-xl cursor-pointer transition-all duration-200 shadow-sm";
        badge.className = "status-icon bg-amber-500 text-white px-2 py-0.5 rounded-full font-semibold text-[10px] animate-pulse";
        badge.innerHTML = "⏳ 분석중";
    } else if (state === 'success') {
        card.className = "flex items-center justify-between p-3 bg-emerald-50/50 border border-emerald-500 rounded-xl cursor-pointer transition-all duration-200 shadow-sm";
        badge.className = "status-icon bg-emerald-600 text-white px-2 py-0.5 rounded-full font-bold text-[10px]";
        badge.innerHTML = "✓ 완료";
    } else if (state === 'error') {
        card.className = "flex items-center justify-between p-3 bg-red-50 border border-red-400 rounded-xl cursor-pointer transition-all duration-200 shadow-sm";
        badge.className = "status-icon bg-red-500 text-white px-2 py-0.5 rounded-full font-semibold text-[10px]";
        badge.innerHTML = "❌ 실패";
    }
}

function renderResult(key, data) {
    const resContainer = document.getElementById(pipelineSteps[key].resId);
    if (!resContainer) return;

    resContainer.classList.remove('text-gray-400', 'italic');
    resContainer.classList.add('text-gray-800', 'font-medium');

    if (key === 'text-gen') {
        resContainer.innerHTML = `<p class="bg-white p-2.5 rounded border leading-relaxed">${data.output}</p>`;
    } else if (key === 'translation') {
        resContainer.innerHTML = `
            <div class="bg-white p-2 rounded border text-[10px] text-gray-400 mb-1">Language: ${data.src_lang} ➔ ${data.tgt_lang}</div>
            <p class="bg-white p-2.5 rounded border text-emerald-700 font-semibold">${data.output}</p>
        `;
    } else if (key === 'sentiment') {
        const color = data.label.includes('긍정') ? 'text-blue-600' : 'text-red-600';
        resContainer.innerHTML = `<p class="bg-white p-2.5 rounded border">결과: <span class="${color} font-bold">${data.label}</span> (신뢰도: <span class="underline">${data.score}%</span>)</p>`;
    } else if (key === 'ner') {
        let tableHtml = `
            <table class="w-full text-left border-collapse bg-white rounded border text-xs mt-1 shadow-sm">
                <thead>
                    <tr class="bg-gray-100 border-b text-gray-600"><th class="p-2">단어</th><th class="p-2">태그</th><th class="p-2">의미</th><th class="p-2">스코어</th></tr>
                </thead>
                <tbody>`;
        data.entities.forEach(item => {
            tableHtml += `<tr class="border-b"><td class="p-2 font-bold text-gray-900">${item.word}</td><td class="p-2 text-red-500 font-semibold">${item.tag}</td><td class="p-2 text-gray-500">${item.meaning}</td><td class="p-2 text-emerald-600 font-mono">${item.score}</td></tr>`;
        });
        tableHtml += `</tbody></table>`;
        resContainer.innerHTML = tableHtml;
    } else if (key === 'qna') {
        resContainer.innerHTML = `
            <div class="bg-white p-3 rounded border shadow-sm space-y-1">
                <span class="text-[10px] text-gray-400 block font-mono">범위: [${data.start} ~ ${data.end}]</span>
                <p class="text-sm">정답 파싱: <span class="bg-yellow-100 px-1.5 py-0.5 rounded font-bold text-gray-900 border border-yellow-200">${data.answer}</span></p>
                <p class="text-[11px] text-emerald-600">정확도: ${(data.score * 100).toFixed(2)}%</p>
            </div>`;
    }
}

document.addEventListener("DOMContentLoaded", () => {
    for (let key in pipelineSteps) {
        updateUIState(key, 'ready');
    }
});
</script>
</body>
</html>
